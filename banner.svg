<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glowL" cx="0%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff1f1f" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff1f1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="100%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff1f1f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff1f1f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="#0a0a0a"/>
  <rect width="1200" height="300" fill="url(#glowL)"/>
  <rect width="1200" height="300" fill="url(#glowR)"/>

  <!-- faint hex of K A R M A -->
  <g font-family="Courier New, monospace" font-size="16" fill="#ff1f1f" opacity="0.22">
    <text x="30" y="40">0x4b 0x41 0x52 0x4d 0x41</text>
    <text x="30" y="270">0x13 :: find_the_problem()</text>
    <text x="900" y="40">while (alive) { learn(); }</text>
    <text x="930" y="270">fix_the_problem();</text>
  </g>

  <!-- glitch layers -->
  <g font-family="Courier New, monospace" font-weight="bold" font-size="150" letter-spacing="14" text-anchor="middle">
    <text x="600" y="165" fill="#ff1f1f" opacity="0.85">KARMA
      <animate attributeName="x" values="606;594;608;600;603;600" dur="3.2s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="165" fill="#ffffff">KARMA</text>
  </g>

  <!-- subtitle + cursor -->
  <text x="319" y="228" font-family="Courier New, monospace" font-size="26" fill="#ffffff">&gt; find the problem. fix the problem.</text>
  <rect x="884" y="208" width="14" height="26" fill="#ff1f1f">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- scanlines + frame -->
  <rect width="1200" height="300" fill="url(#scan)"/>
  <rect x="0" y="0" width="1200" height="4" fill="#ff1f1f"/>
  <rect x="0" y="296" width="1200" height="4" fill="#ff1f1f"/>
</svg>
